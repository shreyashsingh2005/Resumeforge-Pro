spring.application.name=resumebuilder

# Magic line jo database khud create kar legi agar nahi hoga
spring.datasource.url=jdbc:mysql://localhost:3306/resume_db?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Explicitly batana padega ki MySQL use ho raha hai taaki Dialect error na aaye
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Photo upload size limit
server.tomcat.max-http-form-post-size=10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB